[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmm"
version = "1.0.0"
description = "Linear multistep methods: order, consistency, zero-stability, convergence and absolute stability, derived from the coefficients."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tu-h-nguyn" }]
keywords = ["numerical-analysis", "ode", "linear-multistep", "dahlquist", "bdf", "adams"]
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Repository = "https://github.com/tu-h-nguyn/Stability-Consistency-and-Convergence-of-Linear-Multistep-Methods"

[project.scripts]
lmm = "lmm.__main__:main"

[tool.setuptools]
packages = ["lmm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
