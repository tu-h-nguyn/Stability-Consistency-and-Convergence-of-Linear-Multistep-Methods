name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the test suite
        run: cd code && python -m pytest tests -q
      - name: Regenerate every figure and table
        run: python code/experiments/run_all.py
      - name: Report whether the committed figures are stale
        run: |
          if git diff --quiet -- figures/; then
            echo "Committed figures match the code."
          else
            echo "::warning::figures/ differs from the committed version; run 'make figures' and commit the result. (Rendering can also vary slightly between matplotlib versions.)"
            git diff --stat -- figures/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: figures
          path: figures/

  report:
    name: Build the LaTeX report
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build the report
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - name: Build the slides
        run: cd slides && latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: |
            main.pdf
            slides/main.pdf
